name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Find and Build iOS App
        run: |
          PROJ_PATH=$(find . -name "*.xcodeproj" -maxdepth 3 | head -n 1)
          if [ -z "$PROJ_PATH" ]; then
            echo "Error: No .xcodeproj found in repository!"
            exit 1
          fi
          echo "Found Xcode project at: $PROJ_PATH"
          xcodebuild -project "$PROJ_PATH" \
                     -scheme iosApp \
                     -sdk iphoneos \
                     -configuration Release \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Upload iOS App Build
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-build
          path: '**/build/Release-iphoneos/'